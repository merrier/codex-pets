name: Release Pet

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          pet_id="${TAG_NAME%-v*}"
          version="${TAG_NAME##*-v}"
          package_name="${pet_id}-codex-pet-v${version}"
          package_dir="dist/${package_name}"

          mkdir -p \
            "${package_dir}/pets/${pet_id}" \
            "${package_dir}/runs/${pet_id}/qa/gifs"

          cp README.md "${package_dir}/README.md"
          cp "pets/${pet_id}/pet.json" "pets/${pet_id}/spritesheet.webp" "${package_dir}/pets/${pet_id}/"
          cp "runs/${pet_id}/qa/gifs/"*.gif "${package_dir}/runs/${pet_id}/qa/gifs/"

          cd dist
          zip -qr "${package_name}.zip" "${package_name}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          pet_id="${TAG_NAME%-v*}"
          version="${TAG_NAME##*-v}"
          package_name="${pet_id}-codex-pet-v${version}"

          gh release create "${TAG_NAME}" "dist/${package_name}.zip" \
            --title "Zhang Yiming Codex Pet v${version}" \
            --notes "Animated Codex pet package for Zhang Yiming. Includes pet.json, spritesheet.webp, and GIF previews." \
            --verify-tag
